name: Refresh AEL Price Cockpit

on:
  schedule:
    - cron: '15 3 * * *'   # 09:15 Asia/Dhaka (03:15 UTC) daily, T-1 data
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ael-price-cockpit
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPA_TOWER_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: pip install requests

      - name: Pull ERP data (full 56-month panel + prices + competition + incentives)
        working-directory: ael-price-analysis
        env:
          ERP_API_KEY: ${{ secrets.ERP_API_KEY }}
          ERP_DEVICE_ID: ${{ secrets.ERP_DEVICE_ID }}
        run: python refresh.py --full

      - name: Rebuild report
        working-directory: ael-price-analysis
        run: |
          node build_categories.js
          node build.js

      - name: Publish to GitHub Pages
        run: |
          cp ael-price-analysis/AEL_Price_Elasticity_Cockpit.html ael-price-cockpit/index.html
          git config user.name "AEL Cockpit Bot"
          git config user.email "bot@akijresource.com"
          git add ael-price-cockpit/index.html
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Refresh AEL price cockpit ($(date -u +%Y-%m-%d))"
            git push
          fi
