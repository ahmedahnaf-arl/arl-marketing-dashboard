name: Deploy Growth Calendar Portal

on:
  push:
    branches: [master]
    paths:
      - 'calendar-portal/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: calendar-portal
        run: npm install --no-audit --no-fund

      - name: Resolve or create Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          npm i -g netlify-cli
          SITE_ID=$(netlify sites:list --json 2>/dev/null | jq -r '.[] | select(.name=="akij-growth-calendar") | .id' | head -1)
          if [ -z "$SITE_ID" ]; then
            SITE_ID=$(netlify sites:create --name akij-growth-calendar --json | jq -r '.id')
          fi
          echo "SITE_ID=$SITE_ID" >> "$GITHUB_ENV"
          echo "Resolved SITE_ID=$SITE_ID"

      - name: Deploy to Netlify (production)
        working-directory: calendar-portal
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          netlify deploy --prod --dir=public --functions=netlify/functions --site="$SITE_ID" --message "Growth Calendar $GITHUB_SHA"

      - name: Make site public (remove Netlify site protection)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          curl -s -X PATCH "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"password":"","sso_login":false}'
          echo "Site public: https://akij-growth-calendar.netlify.app"

      - name: Configure Blobs environment variables
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          ACCOUNT_ID=$(curl -s "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" | jq -r '.account_id')
          PAYLOAD=$(jq -n --arg sid "$SITE_ID" --arg tok "$NETLIFY_AUTH_TOKEN" '[
            {key:"NETLIFY_SITE_ID", values:[{value:$sid, context:"all"}]},
            {key:"NETLIFY_BLOBS_TOKEN", values:[{value:$tok, context:"all"}], is_secret:true}
          ]')
          curl -s -X POST "https://api.netlify.com/api/v1/accounts/$ACCOUNT_ID/env" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" >/dev/null
          echo "Blobs env vars configured (NETLIFY_SITE_ID, NETLIFY_BLOBS_TOKEN)"
