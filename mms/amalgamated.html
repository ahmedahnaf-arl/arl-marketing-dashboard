function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function crm(n){return n==null?'—':('BDT '+Number(n).toLocaleString('en-IN',{maximumFractionDigits:1})+' Cr');}
function pct2(n){return n==null?'—':(Number(n).toFixed(2)+'%');}
function fmt(kp,v){ if(v==null)return '—'; if(kp.unit==='BDT Cr')return Number(v).toLocaleString('en-IN'); if(kp.unit==='%'||kp.unit==='% YoY')return Number(v).toFixed(kp.unit==='% YoY'?1:1)+'%'; if(kp.unit==='score'||kp.unit==='index')return Number(v).toFixed(0); if(kp.unit==='x')return Number(v).toFixed(1)+'x'; if(kp.unit==='/5')return Number(v).toFixed(1); return String(v); }
function qFmt(kp,v){ if(v==null)return '—'; if(kp.unit==='BDT Cr')return Number(v).toLocaleString('en-IN'); if(kp.unit==='%'||kp.unit==='% YoY')return Number(v).toFixed(1); if(kp.unit==='score'||kp.unit==='index')return Number(v).toFixed(0); if(kp.unit==='x')return Number(v).toFixed(1); if(kp.unit==='/5')return Number(v).toFixed(1); return String(v); }
/* quarter phasing: revenue = seasonal; others = linear 4-step from prior year-end to FY target */
function phaseQuarter(kp,fi){ var annual=kp.fy[fi]; var prev=fi===0?kp.base:kp.fy[fi-1]; if(kp.k==='Brand Revenue Contribution'){var s=[0.22,0.24,0.27,0.27];return s.map(function(x){return Math.round(annual*x);});} var st=(annual-prev)/4; return [prev+st,prev+2*st,prev+3*st,annual]; }
function qMatrixHTML(b,fi){
  var rows=ACCL_KPIS.map(function(kp){ var q=phaseQuarter(kp,fi); return '<tr><td><b>'+kp.k+'</b><div style="font-size:9px;color:var(--mut)">'+kp.unit+' · '+kp.conf+'</div></td>'+q.map(function(v){return '<td class="num">'+qFmt(kp,v)+'</td>';}).join('')+'<td class="num"><b>'+qFmt(kp,kp.fy[fi])+'</b></td></tr>'; }).join('');
  return '<table class="tbl"><tr class="trh"><th>KPI</th><th class="num">Q1 (Jul–Sep)</th><th class="num">Q2 (Oct–Dec)</th><th class="num">Q3 (Jan–Mar)</th><th class="num">Q4 (Apr–Jun)</th><th class="num">FY total</th></tr>'+rows+'</table>';
}

  '<div class="card"><div class="stabbar">'+FY.map(function(f,i){ return '<button class="stab'+(i===0?' active':'')+'" id="compFy'+i+'" onclick="setCompFy('+i+')">'+f+'</button>'; }).join('')+'</div><div id="compwrap">'+compMatrixHTML(b,0)+'</div>'+
  '<p class="note">Akij grows 4.51% \u2192 8.87% (+4.36 pp). Competitors\u2019 share declines proportionally so the market always sums to 100% \u2014 Akij\u2019s gain is the competitors\u2019 loss. Quarter values interpolate linearly within each FY.</p></div></div>';
}
function campaignMatrixHTML(b, fi){
  var ob = optBudget(b);
  var akij = null; compTraj(b).forEach(function(r){ if(r.ours) akij = r; });
  var qshare = compQ(akij)[fi];
  var qrev = revQuarters(b)[fi];
  var qbud = ob[fi].q;
  var plan = CAMPAIGN_PLAN[fi];
  var header = '<div style="margin-bottom:12px"><b style="font-size:13px;color:var(--ink)">'+plan[0]+' \u2014 '+plan[1]+'</b><div style="font-size:11px;color:var(--mut);margin-top:3px">'+plan[2]+'</div></div>';
  var rows = '<table class="tbl"><tr class="trh"><th>Metric</th><th class="num">Q1 (Jul\u2013Sep)</th><th class="num">Q2 (Oct\u2013Dec)</th><th class="num">Q3 (Jan\u2013Mar)</th><th class="num">Q4 (Apr\u2013Jun)</th><th class="num">FY total</th></tr>';
  rows += '<tr><td><b>Budget (Cr)</b></td>'+qbud.map(function(v){return '<td class="num">'+v.toFixed(2)+'</td>';}).join('')+'<td class="num"><b>'+ob[fi].annual.toFixed(2)+'</b></td></tr>';
  rows += '<tr><td><b>Market share</b></td>'+qshare.map(function(v){return '<td class="num">'+v.toFixed(2)+'%</td>';}).join('')+'<td class="num"><b>'+shareTraj(b)[fi].toFixed(2)+'%</b></td></tr>';
  rows += '<tr><td><b>Revenue (Cr)</b></td>'+qrev.map(function(v){return '<td class="num">'+v.toLocaleString('en-IN')+'</td>';}).join('')+'<td class="num"><b>'+b.revenue[fi].toLocaleString('en-IN')+'</b></td></tr>';
  rows += '</table>';
  return header + rows;
}

    '</table></div></td></tr>';

  '<p class="note">Budget = revenue \u00d7 1.02% intensity. ATL/BTL/Digital/PR split follows the FY26-27 channel mix.</p></div></div>';

function causalMatrixHTML(b, fi){
  var shBase = b.marketShareBase, shFy = shareTraj(b);
  var revBase = b.revenueBase, revFy = b.revenue;
  var rows = CAUSAL.map(function(c){
    var kpi = [c.kpiBase].concat(c.kpiFy);
    var sh = [shBase].concat(shFy.map(function(s){ return shBase + (s - shBase) * c.w; }));
    var rev = [revBase].concat(revFy.map(function(r){ return revBase + (r - revBase) * c.w; }));
    var j = fi + 1;
    var kstep = (kpi[j]-kpi[j-1])/4, sstep = (sh[j]-sh[j-1])/4, rstep = (rev[j]-rev[j-1])/4;
    var cells = '';
    for(var q=1; q<=4; q++){
      var kv = kpi[j-1]+kstep*q, sv = sh[j-1]+sstep*q, rv = rev[j-1]+rstep*q;
      cells += '<td class="num"><b>'+kv.toFixed(1)+' '+c.unit+'</b><div style="font-size:9px;color:var(--mut);font-weight:600">'+sv.toFixed(2)+'% \u00b7 '+Math.round(rv).toLocaleString('en-IN')+' Cr</div></td>';
    }
    cells += '<td class="num"><b>'+kpi[j].toFixed(1)+' '+c.unit+'</b><div style="font-size:9px;color:var(--mut);font-weight:600">'+sh[j].toFixed(2)+'% \u00b7 '+Math.round(rev[j]).toLocaleString('en-IN')+' Cr</div></td>';
    return '<tr><td><b>'+c.act+'</b><div style="font-size:9px;color:var(--mut)">'+c.kpis+'</div></td>'+cells+'</tr>';
  }).join('');
  return '<table class="tbl"><tr class="trh"><th>Activity</th><th class="num">Q1 (Jul\u2013Sep)</th><th class="num">Q2 (Oct\u2013Dec)</th><th class="num">Q3 (Jan\u2013Mar)</th><th class="num">Q4 (Apr\u2013Jun)</th><th class="num">FY total</th></tr>'+rows+'</table>';
}

function custShortfalls(){
  var ma=measurementActuals(); if(!ma) return {state:'none'};
  var out=[];
  Object.keys(ma).forEach(function(id){
    var pat=MMEAS_PAT[id]; if(!pat) return;
    var kp=null; for(var i=0;i<ACCL_KPIS.length;i++){ if(pat.test(ACCL_KPIS[i].k)){ kp=ACCL_KPIS[i]; break; } }
    if(!kp) return;
    var act=Number(ma[id]); if(isNaN(act)) return;
    var tgt=kp.fy[0]; if(tgt==null||tgt===0) return;
    var att=act/tgt; var bs=parseFloat(score5(kp,-1)); var cs=mScore(kp,act); var d=(cs!=null&&bs!=null)?(cs-bs):0;
    if(att<0.999 || d<-0.05) out.push({name:kp.k,act:act,tgt:tgt,att:att,d:d});
  });
  return {state:'ok',rows:out};
}

function actImpact(a, ownShare, compShare){
  var BASE={price_cut:0.62,promotion:0.46,tvc:0.40,digital:0.30,dealer_scheme:0.52,new_product:0.56,other:0.25};
  var base=BASE[a.type]||0.25;
  var spendF=Math.max(0,Math.min(1,(Number(a.budget)||0)/50000000));
  var reachF=Math.max(0,Math.min(1,(Number(a.reach)||0)/2000000));
  var intensity=Math.max(0,Math.min(1, base*0.55 + spendF*0.25 + reachF*0.20));
  var t=Math.round(intensity*100);
  return {threat:t, level:t>=65?'high':t>=40?'med':'low', our:-(intensity*0.12*ownShare), their:(intensity*0.10*ownShare)};
}

var P4CAUSAL = [
  {act:'Product', kpi:'Perceived Quality', kpiBase:68, kpiFy:[72,76,79,82,85], unit:'index', w:0.25, desc:'iron-slag CEM-II/AM hero SKU'},

];
function p4CausalMatrix(b, fi){
  var shBase = b.marketShareBase, shFy = shareTraj(b);
  var revBase = b.revenueBase, revFy = b.revenue;
  var rows = P4CAUSAL.map(function(c){
    var kpi = [c.kpiBase].concat(c.kpiFy);
    var sh = [shBase].concat(shFy.map(function(s){ return shBase + (s - shBase) * c.w; }));
    var rev = [revBase].concat(revFy.map(function(r){ return revBase + (r - revBase) * c.w; }));
    var j = fi + 1;
    var kstep = (kpi[j]-kpi[j-1])/4, sstep = (sh[j]-sh[j-1])/4, rstep = (rev[j]-rev[j-1])/4;
    var cells = '';
    for(var q=1; q<=4; q++){
      var kv = kpi[j-1]+kstep*q, sv = sh[j-1]+sstep*q, rv = rev[j-1]+rstep*q;
      cells += '<td class="num"><b>'+kv.toFixed(1)+' '+c.unit+'</b><div style="font-size:9px;color:var(--mut);font-weight:600">'+sv.toFixed(2)+'% \u00b7 '+Math.round(rv).toLocaleString('en-IN')+' Cr</div></td>';
    }
    cells += '<td class="num"><b>'+kpi[j].toFixed(1)+' '+c.unit+'</b><div style="font-size:9px;color:var(--mut);font-weight:600">'+sh[j].toFixed(2)+'% \u00b7 '+Math.round(rev[j]).toLocaleString('en-IN')+' Cr</div></td>';
    return '<tr><td><b>'+c.act+' \u2014 '+c.kpi+'</b><div style="font-size:9px;color:var(--mut)">'+c.desc+'</div></td>'+cells+'</tr>';
  }).join('');
  return '<table class="tbl"><tr class="trh"><th>4P \u2192 KPI</th><th class="num">Q1 (Jul\u2013Sep)</th><th class="num">Q2 (Oct\u2013Dec)</th><th class="num">Q3 (Jan\u2013Mar)</th><th class="num">Q4 (Apr\u2013Jun)</th><th class="num">FY total</th></tr>'+rows+'</table>';
}

function toggleTheme(){

  updateThemeBtn();
}

}
