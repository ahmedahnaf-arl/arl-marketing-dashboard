<script>
const D = __PAYLOAD__;
const M = D.months, MI = Object.fromEntries(M.map((m,i)=>[m,i]));
const ROWS = D.rows, SER = D.series, DECL = D.decl, PS = D.ps||{}, PORT = D.port;
const CHN = D.chNames||{}, CHROWS = D.chRows||[], CATMAP = D.cats||{}, CATCOUNTS = D.catCounts||{};
const COMPM = D.compMarket||[], COMPB = D.compBench||[], CMO = D.compMonths||[];

const nf=(v,d)=>{d=d||0;return (v==null||!isFinite(v))?"—":Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});};
const pf=(v,d)=>{d=(d==null?1:d);return (v==null||!isFinite(v))?"—":(v*100).toFixed(d)+"%";};
const bcr=v=>(v==null?"—":(v/1e7).toLocaleString("en-US",{maximumFractionDigits:(Math.abs(v)<1e7?2:1)}));
const cls=v=>(v==null?"":(v>0?"pos":"neg"));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ---------- tooltip ---------- */
var TIP=document.createElement('div'); TIP.className='tip'; document.body.appendChild(TIP);
function tipShow(h,x,y){TIP.innerHTML=h;TIP.style.opacity=1;var w=TIP.offsetWidth,hh=TIP.offsetHeight;
  TIP.style.left=Math.min(x+14,window.innerWidth-w-12)+'px';TIP.style.top=Math.max(8,y-hh-14)+'px';}
function tipHide(){TIP.style.opacity=0;}
function bindAll(root){(root||document).querySelectorAll('[data-tip]').forEach(function(el){if(el.__b)return;el.__b=1;
  el.addEventListener('mouseenter',function(e){tipShow(el.getAttribute('data-tip'),e.clientX,e.clientY);});
  el.addEventListener('mousemove',function(e){tipShow(el.getAttribute('data-tip'),e.clientX,e.clientY);});
  el.addEventListener('mouseleave',tipHide);});
 (root||document).querySelectorAll('[data-code]').forEach(function(el){if(el.__c)return;el.__c=1;el.style.cursor='pointer';
  el.addEventListener('click',function(ev){ev.stopPropagation();tipHide();openMom(el.getAttribute('data-code'));});});}

/* ---------- tabs ---------- */
function showTab(t){document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t);});
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===t);});
  window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){showTab(b.dataset.t);};});
if(location.hash){var _h=location.hash.slice(1);if(document.getElementById(_h))showTab(_h);}
window.addEventListener('hashchange',function(){var _h=location.hash.slice(1);if(document.getElementById(_h))showTab(_h);});

/* ---------- declared price resolution ---------- */
var DECLMAP={}; DECL.forEach(function(d){DECLMAP[d.c]=d.pts;});
function retailAt(code,ym){var pts=DECLMAP[code];if(!pts||!pts.length)return null;var end=ym+'-31',out=null;
  for(var i=0;i<pts.length;i++){if(pts[i].last&&pts[i].last<=end)out=pts[i];else break;}return out;}
function gridAt(code,ch,ym){var arr=PS[code];if(!arr)return null;var lo=ym+'-01',hi=ym+'-31',out=null;
  for(var i=0;i<arr.length;i++){var p=arr[i];if(p.ch!==ch)continue;if(p.from<=hi&&p.to>=lo){if(!out||p.from>out.from)out=p;}}return out;}
function priceAt(code,ym){var rl=retailAt(code,ym),d=gridAt(code,71,ym),t=gridAt(code,70,ym);
  return {dp:d?d.pr:(rl?rl.dp:null),tp:t?t.pr:(rl?rl.tp:null),mrp:rl?rl.mrp:null};}

/* ---------- CHANNEL INDEX: code -> month -> [[ch,q,v]] ---------- */
var CHIDX={};
for(var ci=0;ci<CHROWS.length;ci++){var cr=CHROWS[ci],mi=cr[0],ch=cr[1],code=cr[2],q=cr[3],v=cr[4];
  var c1=CHIDX[code]||(CHIDX[code]={}); var c2=c1[mi]||(c1[mi]=[]); c2.push([ch,q,v]);}

/* ---------- METADATA per code ---------- */
var META={}; ROWS.forEach(function(r){META[r.c]=r;});
var CATLIST=Object.keys(CATCOUNTS).sort(function(a,b){return CATCOUNTS[b]-CATCOUNTS[a];});

/* ---------- STATE + FRAME ---------- */
var _nowYM=(new Date()).toISOString().slice(0,7);
var _lastPartial=(M[M.length-1]===_nowYM);            // panel may or may not include the live month
var END=M.length-1-(_lastPartial?1:0);                // last complete month index
var F={from:0,to:END,chans:new Set(),cats:new Set()};
var FR=null;

function buildFrame(){
  var idxs=[]; for(var i=F.from;i<=F.to;i++)idxs.push(i);
  var chOn=F.chans.size>0, catOn=F.cats.size>0;
  var out={idxs:idxs,months:idxs.map(function(i){return M[i];}),series:{},codes:[],agg:{},chAgg:{}};
  idxs.forEach(function(i){out.agg[i]={v:0,q:0,d:0,f:0,n:0};});
  for(var ci2=0;ci2<ROWS.length;ci2++){
    var r=ROWS[ci2];
    if(catOn && !F.cats.has(r.cat||'Unmapped')) continue;
    var src=SER[r.c]; if(!src) continue;
    var arr=new Array(idxs.length).fill(null), any=false;
    for(var k=0;k<idxs.length;k++){
      var i2=idxs[k], x=src[i2]; if(!x||x[0]<=0) continue;
      if(chOn){
        var cm=CHIDX[r.c]&&CHIDX[r.c][i2]; if(!cm) continue;
        var q2=0,v2=0;
        for(var z=0;z<cm.length;z++){ if(F.chans.has(cm[z][0])){q2+=cm[z][1];v2+=cm[z][2];} }
        if(!(v2>0)) continue;
        arr[k]={q:q2,v:v2,d:0,f:0,p:v2/q2};
      } else {
        arr[k]={q:x[0],v:x[1],d:x[2]||0,f:x[3]||0,p:x[1]/x[0]};
      }
      any=true;
    }
    if(!any) continue;
    out.series[r.c]=arr; out.codes.push(r.c);
    for(var k2=0;k2<idxs.length;k2++){var y=arr[k2];if(!y)continue;var a=out.agg[idxs[k2]];
      a.v+=y.v;a.q+=y.q;a.d+=y.d;a.f+=y.f;a.n++;}
  }
  out.codes.sort(function(a,b){
    var va=0,vb=0; out.series[a].forEach(function(x){if(x)va+=x.v;}); out.series[b].forEach(function(x){if(x)vb+=x.v;});
    return vb-va;});
  return out;
}
function refresh(){ FR=buildFrame(); renderAll(); }

/* ---------- REGRESSION per code on the frame ---------- */
function cleanObs(code){
  var s=FR.series[code]; if(!s) return [];
  var obs=[]; for(var i=0;i<s.length;i++){var x=s[i];if(x&&x.q>0&&x.p>0)obs.push({i:i,q:x.q,v:x.v,p:x.p,d:x.d,f:x.f});}
  if(obs.length<2) return obs;
  var lp=obs.map(function(o){return Math.log(o.p);}).slice().sort(function(a,b){return a-b;});
  var med=lp[Math.floor(lp.length/2)], lim=Math.log(5);
  return obs.filter(function(o){return Math.abs(Math.log(o.p)-med)<=lim;});
}
function recentStats(code){
  var cl=cleanObs(code); if(cl.length<2) return {pChg:null,vChg:null};
  var n=cl.length, k=Math.min(3,Math.max(1,Math.floor(n/2)));
  var a=cl.slice(n-2*k,n-k), b=cl.slice(n-k);
  var ap=a.reduce(function(s,o){return s+o.p;},0)/a.length, bp=b.reduce(function(s,o){return s+o.p;},0)/b.length;
  var aq=a.reduce(function(s,o){return s+o.q;},0)/a.length, bq=b.reduce(function(s,o){return s+o.q;},0)/b.length;
  return {pChg:ap?bp/ap-1:null, vChg:aq?bq/aq-1:null, k:k};
}
function regress(code){
  var pts=cleanObs(code); if(pts.length<8) return null;
  pts=pts.map(function(o){return {k:o.i,p:o.p,q:o.q};});
  // first differences between consecutive frame months
  var d=[];
  for(var i=1;i<pts.length;i++){ if(pts[i].k===pts[i-1].k+1){
    var dx=Math.log(pts[i].p/pts[i-1].p), dy=Math.log(pts[i].q/pts[i-1].q);
    if(isFinite(dx)&&isFinite(dy))d.push({x:dx,y:dy});}}
  if(d.length<8) return null;
  var n=d.length,sx=0,sy=0,sxx=0,sxy=0,syy=0;
  d.forEach(function(o){sx+=o.x;sy+=o.y;sxx+=o.x*o.x;sxy+=o.x*o.y;syy+=o.y*o.y;});
  var den=n*sxx-sx*sx; if(Math.abs(den)<1e-12)return null;
  var b=(n*sxy-sx*sy)/den, a=(sy-b*sx)/n;
  var ssr=0,sst=0,my=sy/n;
  d.forEach(function(o){var pr=a+b*o.x;ssr+=(o.y-pr)*(o.y-pr);sst+=(o.y-my)*(o.y-my);});
  var r2=sst>0?1-ssr/sst:0;
  var sdx=Math.sqrt(Math.max(0,sxx/n-(sx/n)*(sx/n)));
  var ok=Math.abs(b)<=8&&sdx>=0.02&&n>=8;
  return {b:b,r2:r2,n:n,sdx:sdx,a:a,ok:ok,pts:pts,d:d};
}

function usableEl(code){
  var e=regress(code);
  if(!e||!e.ok) return null;
  if(e.r2<0.10||Math.abs(e.b)>5) return null;
  return e;
}
function elComment(el){
  if(!el) return 'Not enough consecutive monthly observations with price movement to estimate an elasticity.';
  if(el.r2<0.10||Math.abs(el.b)>5){
    return 'β = '+el.b.toFixed(2)+' but R² is only '+el.r2.toFixed(2)+' over '+el.n+' pairs — price and volume are not moving in a consistent relationship, so this is <b>not a reliable elasticity</b>. Do not price off it; treat the SKU as “no measurable response” and re-test after more price variation.';
  }
  var mag=Math.abs(el.b);
  var t='β = '+el.b.toFixed(2)+' over '+el.n+' month-to-month pairs (R² '+el.r2.toFixed(2)+'). ';
  t+='A 10% price cut is associated with roughly '+(mag*10).toFixed(0)+'% '+(el.b<0?'more':'less')+' volume. ';
  if(el.b<-1) t+='Because |β| is above 1, a price cut would raise revenue on this SKU.';
  else if(el.b<0) t+='Because |β| is below 1, a price cut would cost revenue — the extra volume does not repay the discount.';
  else t+='Positive β means price and volume moved together: this reads as cost pass-through, not pricing power.';
  if(el.r2<0.15) t+=' The fit is weak, so treat it as directional only.';
  return t;
}

/* ---------- KPIs + commentary ---------- */
function frameTotals(){
  var v=0,q=0,d=0,f=0; Object.keys(FR.agg).forEach(function(i){v+=FR.agg[i].v;q+=FR.agg[i].q;d+=FR.agg[i].d;f+=FR.agg[i].f;});
  return {v:v,q:q,d:d,f:f};
}
function renderKPIs(){
  var t=frameTotals();
  document.getElementById('k1').textContent='৳'+bcr(t.v)+' Cr';
  document.getElementById('k1n').textContent=FR.months[0]+' → '+FR.months[FR.months.length-1]+' · '+(t.d>0?'net of discounts':'gross, channel view');
  document.getElementById('k2').textContent=nf(FR.codes.length);
  var lastIdx=FR.idxs[FR.idxs.length-1];
  document.getElementById('k3').textContent=nf(FR.agg[lastIdx]?FR.agg[lastIdx].n:0);
  document.getElementById('k3n').textContent='SKUs with sales in '+FR.months[FR.months.length-1];
  var dec=FR.codes.filter(function(c){return META[c]&&(META[c].dp!=null||META[c].tp!=null||META[c].mrp!=null);});
  document.getElementById('k4').textContent=nf(dec.length);
  var els=[]; FR.codes.forEach(function(c){var e=usableEl(c); if(e)els.push(e.b);});
  els.sort(function(a,b){return a-b;});
  document.getElementById('k5').textContent=els.length?els[Math.floor(els.length/2)].toFixed(2):'—';
  document.getElementById('k5n').textContent=els.length+' measurable SKUs in view';
}

/* ---------- chart: portfolio ---------- */
function renderPort(){
  var idxs=FR.idxs, data=idxs.map(function(i){return {m:M[i],v:FR.agg[i].v,n:FR.agg[i].n,q:FR.agg[i].q};});
  var W=680,H=270,pad={l:46,r:44,t:14,b:30};
  var maxV=Math.max.apply(null,data.map(function(d){return d.v;}))||1;
  var maxN=Math.max.apply(null,data.map(function(d){return d.n;}))||1;
  var bw=(W-pad.l-pad.r)/Math.max(1,data.length);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(var i=0;i<=4;i++){var y=pad.t+(H-pad.t-pad.b)*i/4;
    s+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y+'" y2="'+y+'" stroke="#22303f"/>';
    s+='<text x="'+(pad.l-6)+'" y="'+(y+3)+'" fill="#8b9bb0" font-size="8.5" text-anchor="end">'+Math.round(maxV*(1-i/4)/1e7)+'</text>';
    s+='<text x="'+(W-pad.r+6)+'" y="'+(y+3)+'" fill="#2dd4bf" font-size="8.5">'+Math.round(maxN*(1-i/4))+'</text>';}
  data.forEach(function(d,k){var h=(H-pad.t-pad.b)*d.v/maxV,x=pad.l+k*bw+bw*0.18;
    s+='<rect x="'+x+'" y="'+(H-pad.b-h)+'" width="'+(bw*0.64)+'" height="'+h+'" rx="1.5" fill="rgba(96,165,250,.55)"/>';
    var prev=k>0?data[k-1].v:null;
    s+='<rect data-tip="<b>'+d.m+'</b><br>Revenue ৳'+bcr(d.v)+' Cr<br>SKUs '+d.n+'<br>MoM '+(prev?pf(d.v/prev-1):'—')+'" x="'+pad.l+k*bw+'" y="'+pad.t+'" width="'+bw+'" height="'+(H-pad.t-pad.b)+'" fill="transparent"/>';});
  var pts=data.map(function(d,k){return [pad.l+k*bw+bw/2,H-pad.b-(H-pad.t-pad.b)*d.n/maxN];});
  s+='<polyline fill="none" stroke="#2dd4bf" stroke-width="1.6" points="'+pts.map(function(p){return p.join(",");}).join(" ")+'"/>';
  var step=Math.ceil(data.length/10);
  data.forEach(function(d,k){if(k%step===0)s+='<text x="'+(pad.l+k*bw+bw/2)+'" y="'+(H-10)+'" fill="#8b9bb0" font-size="8" text-anchor="middle">'+d.m.slice(2)+'</text>';});
  s+='</svg>';
  document.getElementById('cPort').innerHTML=s; bindAll(document.getElementById('cPort'));
}

/* ---------- chart: breadth ---------- */
function renderBreadth(){
  var idxs=FR.idxs, out=[];
  idxs.forEach(function(i,k){
    var up=0,dn=0,fl=0;
    FR.codes.forEach(function(c){var s=FR.series[c],x=s[k];if(!x||!x.p)return;
      var j=k-1;while(j>=0&&(!s[j]||!s[j].p))j--; if(j<0)return;
      var ch=x.p/s[j].p-1; if(ch>0.005)up++;else if(ch<-0.005)dn++;else fl++;});
    out.push({m:M[i],up:up,dn:dn,fl:fl,n:up+dn+fl});
  });
  var W=680,H=270,pad={l:46,r:16,t:14,b:30},mid=pad.t+(H-pad.t-pad.b)/2;
  var bw=(W-pad.l-pad.r)/Math.max(1,out.length);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+mid+'" y2="'+mid+'" stroke="#3a4a5e"/>';
  out.forEach(function(b,k){var tot=b.n||1,uh=(H-pad.t-pad.b)*0.5*b.up/tot,dh=(H-pad.t-pad.b)*0.5*b.dn/tot,x=pad.l+k*bw+bw*0.15;
    s+='<rect x="'+x+'" y="'+(mid-uh)+'" width="'+(bw*0.7)+'" height="'+uh+'" fill="rgba(242,109,109,.75)"/>';
    s+='<rect x="'+x+'" y="'+mid+'" width="'+(bw*0.7)+'" height="'+dh+'" fill="rgba(45,212,191,.75)"/>';
    s+='<rect data-tip="<b>'+b.m+'</b><br>Price up: '+b.up+' ('+Math.round(b.up/tot*100)+'%)<br>Price down: '+b.dn+' ('+Math.round(b.dn/tot*100)+'%)" x="'+x+'" y="'+pad.t+'" width="'+(bw*0.7)+'" height="'+(H-pad.t-pad.b)+'" fill="transparent"/>';
    if(k%Math.ceil(out.length/10)===0)s+='<text x="'+x+'" y="'+(H-10)+'" fill="#8b9bb0" font-size="8" text-anchor="middle">'+b.m.slice(2)+'</text>';});
  s+='<text x="'+(pad.l-6)+'" y="'+(pad.t+8)+'" fill="#f26d6d" font-size="8.5" text-anchor="end">up</text>';
  s+='<text x="'+(pad.l-6)+'" y="'+(H-pad.b-2)+'" fill="#2dd4bf" font-size="8.5" text-anchor="end">down</text></svg>';
  document.getElementById('cBreadth').innerHTML=s; bindAll(document.getElementById('cBreadth'));
}

/* ---------- commentary ---------- */
function renderNotes(){
  var t=frameTotals(), arr=FR.idxs.map(function(i){return FR.agg[i].v;});
  var first=arr[0]||0,last=arr[arr.length-1]||0;
  var nz=arr.filter(function(v){return v>0;});
  var avg=nz.length?nz.reduce(function(a,b){return a+b;},0)/nz.length:0;
  var el=[]; FR.codes.forEach(function(c){var e=regress(c);if(e&&e.ok)el.push(e.b);});
  var neg=el.filter(function(b){return b<0;}).length;
  document.getElementById('noteOv').innerHTML =
    'In the selected window ('+FR.months[0]+' → '+FR.months[FR.months.length-1]+', '+FR.months.length+' months'+
    (F.chans.size?' · '+F.chans.size+' channel(s)':'')+(F.cats.size?' · '+F.cats.size+' category(ies)':'')+
    '), revenue was <b>৳'+bcr(t.v)+' Cr</b> across <b>'+FR.codes.length+'</b> SKUs, averaging ৳'+bcr(avg)+
    ' Cr a month. The latest month is '+(first?((last/first-1)*100).toFixed(0):'—')+'% versus the first month of the window. '+
    (el.length?('Across '+el.length+' measurable SKUs the median elasticity is '+(el.length?el.slice().sort(function(a,b){return a-b;})[Math.floor(el.length/2)].toFixed(2):'—')+', with '+neg+' moving normally (negative).'):'');
}

/* ---------- all SKUs table ---------- */
var ST={sort:'v',dir:-1,q:'',el:'',decl:'',move:''};
function rowStats(code){
  var s=FR.series[code], obs=[], totV=0,totQ=0,totD=0,totF=0;
  s.forEach(function(x){if(x){totV+=x.v;totQ+=x.q;totD+=x.d;totF+=x.f;}});
  var cl=cleanObs(code);
  var firstP=null,lastP=null,lastChg=null,lastVol=null;
  if(cl.length){firstP=cl[0].p;lastP=cl[cl.length-1].p;}
  if(cl.length>=2){var a=cl[cl.length-2],b=cl[cl.length-1];lastChg=b.p/a.p-1;lastVol=b.q/a.q-1;}
  var moves=0;for(var j=1;j<cl.length;j++){if(Math.abs(cl[j].p/cl[j-1].p-1)>=0.02)moves++;}
  return {totV:totV,totQ:totQ,totD:totD,totF:totF,firstP:firstP,lastP:lastP,
    pc:(firstP&&lastP)?lastP/firstP-1:null,lastChg:lastChg,lastVol:lastVol,moves:moves,
    months:obs.length,firstMonth:FR.months[FR.series[code].findIndex(function(x){return x;})]||'',
    lastMonth:FR.months[s.length-1-(s.slice().reverse().findIndex(function(x){return x&&x.q>0;}))]};
}
function elTag(code){
  var e=usableEl(code), raw=regress(code);
  if(!e) return raw?'<span class="tag t-mut">unstable '+raw.b.toFixed(2)+'</span>':'<span class="tag t-mut">n/a</span>';
  if(e.b>0) return '<span class="tag t-pos">anom '+e.b.toFixed(2)+'</span>';
  if(e.b<-1) return '<span class="tag t-neg">elastic '+e.b.toFixed(2)+'</span>';
  return '<span class="tag t-neg" style="color:#9fb0c4">inelastic '+e.b.toFixed(2)+'</span>';
}
function renderSku(){
  var list=FR.codes.slice();
  if(ST.q){var q=ST.q.toLowerCase();list=list.filter(function(c){var m=META[c];return c.indexOf(q)>=0||(m&&m.n.toLowerCase().indexOf(q)>=0);});}
  if(ST.el==='neg')list=list.filter(function(c){var e=regress(c);return e&&e.ok&&e.b<-1;});
  if(ST.el==='pos')list=list.filter(function(c){var e=regress(c);return e&&e.ok&&e.b>0;});
  if(ST.el==='na')list=list.filter(function(c){var e=regress(c);return !e||!e.ok;});
  if(ST.decl==='y')list=list.filter(function(c){var m=META[c];return m&&(m.dp!=null||m.tp!=null||m.mrp!=null);});
  var stats={}; list.forEach(function(c){stats[c]=rowStats(c);});
  var k=ST.sort;
  list.sort(function(a,b){
    var A,B;
    if(k==='n'){A=(META[a]?META[a].n:'');B=(META[b]?META[b].n:'');return (A<B?-1:A>B?1:0)*ST.dir;}
    if(k==='el'){var ea=regress(a),eb=regress(b);A=ea?ea.b:-9e9;B=eb?eb.b:-9e9;}
    else {A=stats[a][k];B=stats[b][k];if(A==null)A=-9e9;if(B==null)B=-9e9;}
    return (A<B?-1:A>B?1:0)*ST.dir;});
  document.getElementById('rc').textContent=list.length+' SKUs in view';
  document.querySelector('#tSku tbody').innerHTML=list.map(function(c){
    var m=META[c]||{},st=stats[c];
    var tip='<b>'+esc(m.n||c)+'</b><br>'+c+' · '+(m.cat||'Unmapped')+'<br>Revenue ৳'+bcr(st.totV)+' Cr · Volume '+nf(st.totQ)+
      '<br>Price '+nf(st.firstP,2)+' → '+nf(st.lastP,2)+' ('+pf(st.pc)+')';
    return '<tr data-code="'+c+'" data-tip="'+esc(tip)+'"><td><b>'+(m.n||c)+'</b>'+(m.ub?' <span class="tag t-mut">UOM</span>':'')+
      '<div class="small">'+c+' · '+(m.cat||'—')+'</div></td>'+

  var W=1000,H=250,pad={l:52,r:58,t:14,b:30};
  var minP=Math.min.apply(null,pts.map(function(o){return o.p;})),maxP=Math.max.apply(null,pts.map(function(o){return o.p;}));
  var minQ=Math.min.apply(null,pts.map(function(o){return o.q;})),maxQ=Math.max.apply(null,pts.map(function(o){return o.q;}));
  var s2='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';

    s2+='<text x="'+(pad.l-6)+'" y="'+(y+3)+'" fill="#8b9bb0" font-size="8.5" text-anchor="end">'+nf(maxQ*(1-j/4))+'</text>';
    s2+='<text x="'+(W-pad.r+6)+'" y="'+(y+3)+'" fill="#f5a524" font-size="8.5">'+nf(maxP*(1-j/4),0)+'</text>';}
  var step=(W-pad.l-pad.r)/Math.max(1,pts.length-1),pq='',pp='';

    var yp=pad.t+(H-pad.t-pad.b)*(1-(o.p-minP)/((maxP-minP)||1));
    pq+=(pq?'L':'M')+x+','+yq;pp+=(pp?'L':'M')+x+','+yp;});

  s2+='<path d="'+pp+'" fill="none" stroke="#f5a524" stroke-width="1.8"/>';

    var yp=pad.t+(H-pad.t-pad.b)*(1-(o.p-minP)/((maxP-minP)||1));
    var mm=pv?o.p/pv-1:null;pv=o.p;
    var tip='<b>'+o.m+'</b><br>Volume '+nf(o.q)+'<br>Price '+nf(o.p,2)+'<br>Price MoM '+(mm==null?'—':pf(mm));
    s2+='<circle cx="'+x+'" cy="'+yq+'" r="5" fill="transparent" data-tip="'+esc(tip)+'"/>';
    s2+='<circle cx="'+x+'" cy="'+yp+'" r="5" fill="transparent" data-tip="'+esc(tip)+'"/>';
    s2+='<circle cx="'+x+'" cy="'+yq+'" r="1.8" fill="#60a5fa"/><circle cx="'+x+'" cy="'+yp+'" r="1.8" fill="#f5a524"/>';

  s2+='</svg><div class="legend"><span><i style="background:#60a5fa"></i>Volume (left)</span><span><i style="background:#f5a524"></i>Realized price (right)</span></div>';

function renderJumps(){

function renderEl(){

  document.getElementById('e3').textContent=els.filter(function(x){return x.e.b>=-1&&x.e.b<=0;}).length;
  document.getElementById('e4').textContent=els.filter(function(x){return x.e.b>0;}).length;
  var med=els.length?els[Math.floor(els.length/2)].e.b:null;
  document.getElementById('elNote').innerHTML=els.length?

     els.filter(function(x){return x.e.b<0;}).length+' move normally (negative), '+els.filter(function(x){return x.e.b>0;}).length+
     ' print positive (cost pass-through). Click any bar or row to see the SKU behind it.'):

  if(unstable) document.getElementById('elNote').innerHTML+=' A further <b>'+unstable+'</b> SKUs show price movement but an unstable fit (R² below 0.10 or |β| above 5) and are excluded from the ranking.';
  var HB=Math.max(200,els.length*18+30),W=680,x0=270,w=300;

  els.forEach(function(x,i){var y=14+i*18,v=x.e.b,len=Math.min(Math.abs(v)/maxAbs*w,w),col=v<0?'#2dd4bf':'#f26d6d';
    var tip='<b>'+esc(x.n)+'</b><br>β '+v.toFixed(2)+' · R² '+x.e.r2.toFixed(2)+' · '+x.e.n+' pairs';
    s+='<text x="0" y="'+(y+9)+'" fill="#8b9bb0" font-size="8.6">'+x.n.slice(0,36)+'</text>';

  s2+='<text x="'+pad.l+'" y="'+(pad.t+9)+'" fill="#8b9bb0" font-size="8.6">Δln(volume)</text></svg>';
  document.getElementById('cElDetail').innerHTML=s2;

/* ---------- channels / categories chips ---------- */
function chTotals(){ // over frame months, respecting category filter
  var t={};
  for(var i=0;i<CHROWS.length;i++){var r=CHROWS[i];if(r[0]<F.from||r[0]>F.to)continue;
    if(F.cats.size){var m=META[r[2]];if(!m||!F.cats.has(m.cat||'Unmapped'))continue;}
    t[r[1]]=(t[r[1]]||0)+r[4];}
  return t;
}
function renderChips(){
  var t=chTotals();
  var keys=Object.keys(t).map(Number).sort(function(a,b){return t[b]-t[a];});
  var h='<span class="chip'+(F.chans.size?'':' on')+'" data-ch="all">All channels</span>';
  keys.forEach(function(c){h+='<span class="chip'+(F.chans.has(c)?' on':'')+'" data-ch="'+c+'">'+(CHN[c]||c)+' · ৳'+bcr(t[c])+'</span>';});
  var el=document.getElementById('chbar');el.innerHTML=h;
  el.querySelectorAll('[data-ch]').forEach(function(x){x.onclick=function(){
    var v=x.getAttribute('data-ch');if(v==='all')F.chans.clear();else{var n=+v;if(F.chans.has(n))F.chans.delete(n);else F.chans.add(n);}
    refresh();};});

  var cats={}; FR.codes.forEach(function(c){var m=META[c];var k=(m&&m.cat)||'Unmapped';cats[k]=(cats[k]||0)+1;});
  var ck=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});

    var rows=[];
    Object.keys(byPack).forEach(function(sku){var p=byPack[sku],o=ours[sku];if(!o||o.q<=0)return;
      var ms=Object.keys(p.m).filter(function(m){return p.m[m].mrp>0;}).sort();if(ms.length<2)return;
      var m1=ms[0],m2=ms[ms.length-1];

      var dps=ms.filter(function(m){return p.m[m].dp>0;});
      var mktDp=dps.length?dps.reduce(function(a,m){return a+p.m[m].dp;},0)/dps.length:null;

      rows.push({sku:sku,g:p.g,ourAvg:ourAvg,mktMrp:mktMrp,mktDp:mktDp,vMrp:ourAvg/mktMrp-1,

      '<td>'+nf(r.vol)+'</td><td class="'+cls(-r.ourChg)+'">'+pf(r.ourChg)+'</td><td class="'+cls(r.mktChg)+'">'+pf(r.mktChg)+'</td><td class="small">'+r.verdict+'</td></tr>';}).join('');

          '<td>'+nf(r.mrp,2)+'</td><td>'+nf(r.dp,2)+'</td><td>'+nf(r.tp,2)+'</td><td>'+nf(r.mrpMin,0)+'–'+nf(r.mrpMax,0)+'</td><td>'+r.n+'</td></tr>';}).join('');
    }

    document.getElementById('bq').oninput=function(e){BS.q=e.target.value;renderBench();};

/* ================= DDA · 5 blocks ================= */
function fyOf(ym){var y=+ym.slice(0,4), m=+ym.slice(5,7); return m>=7?y:y-1;}
function fyLab(fy){return 'FY'+fy+'-'+String((fy+1)%100).padStart(2,'0');}

function fyRollup(){
  var out={};
  FR.idxs.forEach(function(mi,k){
    var fy=fyOf(M[mi]);
    var o=out[fy]||(out[fy]={rev:0,months:0,skus:{},q:0});
    o.rev+=FR.agg[mi].v; o.q+=FR.agg[mi].q; o.months++;
    FR.codes.forEach(function(c){var s=FR.series[c][k];if(s&&s.v>0)o.skus[c]=1;});
  });
  var del={}; (D.delFy||[]).forEach(function(d){del[+d.fy]=d;});
  Object.keys(out).forEach(function(fy){var o=out[fy];o.skus=Object.keys(o.skus).length;o.del=(del[fy]||{}).deliveries||null;});
  return out;
}
function sameMonthGap(){
  var cur={},prev={};
  FR.idxs.forEach(function(mi,k){
    var ym=M[mi], mo=+ym.slice(5,7), fy=fyOf(ym);
    var latestFy=fyOf(M[FR.idxs[FR.idxs.length-1]]);
    if(fy===latestFy) cur[mo]=(cur[mo]||0)+FR.agg[mi].v;
    if(fy===latestFy-1) prev[mo]=(prev[mo]||0)+FR.agg[mi].v;
  });
  var months=Object.keys(cur).map(Number).sort(function(x,y){return x-y;});
  return {cur:cur,prev:prev,months:months};
}

function renderDDA(){
  if(!document.getElementById('tFy')) return;
  var fy=fyRollup(), fys=Object.keys(fy).map(Number).sort(function(a,b){return a-b;});
  var gap=sameMonthGap();
  var curRev=gap.months.reduce(function(s,m){return s+(gap.cur[m]||0);},0);
  var prevRev=gap.months.reduce(function(s,m){return s+(gap.prev[m]||0);},0);
  var dPct=prevRev?curRev/prevRev-1:null;

  document.getElementById('ddaHead').innerHTML =
    'Latest fiscal year in view: <b>'+fyLab(fys[fys.length-1])+'</b>, covering '+gap.months.length+' month(s) so far. '+
    'Revenue over those months is <b>৳'+bcr(curRev)+' Cr</b> against ৳'+bcr(prevRev)+' Cr in the same months last year ('+pf(dPct)+'). '+
    (curRev<prevRev?('The gap is <b>৳'+bcr(prevRev-curRev)+' Cr behind</b> — that is the number the recovery plan has to close.'):('Revenue is <b>৳'+bcr(curRev-prevRev)+' Cr ahead</b> of last year.'));

  /* ---------- 01 Direction ---------- */
  (function(){
    var W=980,H=260,pad={l:52,r:60,t:16,b:34};
    var data=FR.idxs.map(function(mi){return {m:M[mi],v:FR.agg[mi].v,fy:fyOf(M[mi])};});
    var maxV=Math.max.apply(null,data.map(function(d){return d.v;}).concat([1]));
    var bw=(W-pad.l-pad.r)/Math.max(1,data.length);
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
    for(var i=0;i<=4;i++){var y=pad.t+(H-pad.t-pad.b)*i/4;
      s+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y+'" y2="'+y+'" stroke="#22303f"/>';
      s+='<text x="'+(pad.l-6)+'" y="'+(y+3)+'" fill="#8b9bb0" font-size="8.5" text-anchor="end">'+Math.round(maxV*(1-i/4)/1e7)+'</text>';}
    var lastFy=null;
    data.forEach(function(d,k){var h=(H-pad.t-pad.b)*d.v/maxV,x=pad.l+k*bw+bw*0.15;
      s+='<rect x="'+x+'" y="'+(H-pad.b-h)+'" width="'+(bw*0.7)+'" height="'+h+'" rx="1.5" fill="rgba(96,165,250,.6)"/>';
      s+='<rect data-tip="<b>'+d.m+'</b><br>'+fyLab(d.fy)+'<br>Revenue ৳'+bcr(d.v)+' Cr" x="'+pad.l+k*bw+'" y="'+pad.t+'" width="'+bw+'" height="'+(H-pad.t-pad.b)+'" fill="transparent"/>';
      if(d.fy!==lastFy){ if(k>0)s+='<line x1="'+(pad.l+k*bw)+'" x2="'+(pad.l+k*bw)+'" y1="'+pad.t+'" y2="'+(H-pad.b)+'" stroke="#f5a524" stroke-dasharray="3,3" opacity=".7"/>';
        s+='<text x="'+(pad.l+k*bw+3)+'" y="'+(pad.t+9)+'" fill="#f5a524" font-size="8">'+fyLab(d.fy)+'</text>'; lastFy=d.fy; }
    });
    var step=Math.ceil(data.length/12);
    data.forEach(function(d,k){if(k%step===0)s+='<text x="'+(pad.l+k*bw+bw/2)+'" y="'+(H-12)+'" fill="#8b9bb0" font-size="8" text-anchor="middle">'+d.m.slice(2)+'</text>';});
    s+='</svg>';
    document.getElementById('cDir').innerHTML=s; bindAll(document.getElementById('cDir'));

    var rows='';
    fys.forEach(function(f,i){
      var o=fy[f], pv=i>0?fy[fys[i-1]]:null;
      var yoy=(pv&&pv.months>=12&&o.months>=12)?o.rev/pv.rev-1:null;
      var partial=o.months<12;
      rows+='<tr><td><b>'+fyLab(f)+'</b>'+(partial?' <span class="small">('+o.months+' mo)</span>':'')+'</td><td>৳'+bcr(o.rev)+' Cr</td>'+
        '<td class="'+cls(yoy)+'">'+pf(yoy)+'</td>'+
        '<td>'+(o.del!=null?nf(o.del):'—')+'</td><td>'+nf(o.skus)+'</td></tr>';
    });
    document.querySelector('#tFy tbody').innerHTML=rows;

    var topDecl=FR.codes.slice(0,3).map(function(c){return (META[c]||{}).n||c;}).join(', ');
    document.getElementById('smartDir').innerHTML=
      '<div class="smart">'+
      '<div><span class="sk">S</span><p>Revenue of ৳'+bcr(curRev)+' Cr across '+gap.months.length+' month(s) of '+fyLab(fys[fys.length-1])+', '+pf(dPct)+' versus the same months last year.</p></div>'+
      '<div><span class="sk">M</span><p>Close the ৳'+bcr(curRev-prevRev)+' Cr gap: that is ৳'+bcr((curRev-prevRev)/Math.max(1,gap.months.length))+' Cr per month of run-rate.</p></div>'+
      '<div><span class="sk">A</span><p>The book is concentrated — the top three SKUs ('+topDecl+') carry a large share, so recovery depends on a few codes.</p></div>'+
      '<div><span class="sk">R</span><p>Reachable only if the declining categories recover volume, not just price: '+gap.months.length+' months of data already show where the volume went.</p></div>'+
      '<div><span class="sk">T</span><p>Monthly tracking against the gap; checkpoint at the Q3 review (Jan-2027).</p></div>'+
      '</div>';
  })();

  /* ---------- 02 Decision ---------- */
  (function(){
    var latestFy=fyOf(M[FR.idxs[FR.idxs.length-1]]);
    function fyYoY(code){
      var s=FR.series[code], cur={}, prev={};
      FR.idxs.forEach(function(mi,k){var x=s[k];if(!x||x.v<=0)return;var fy=fyOf(M[mi]),mo=+M[mi].slice(5,7);
        if(fy===latestFy)cur[mo]=(cur[mo]||0)+x.v; else if(fy===latestFy-1)prev[mo]=(prev[mo]||0)+x.v;});
      var cTot=0,pTot=0;
      Object.keys(cur).forEach(function(mo){if(prev[mo]!=null){cTot+=cur[mo];pTot+=prev[mo];}});
      return pTot>0?cTot/pTot-1:null;
    }
    var dec=FR.codes.map(function(c){
      var m=META[c]||{}, st=rowStats(c), rs=recentStats(c);
      var gapTP=(m.tp&&st.lastP)?st.lastP/m.tp-1:null;
      return {c:c,n:m.n||c,cat:m.cat||'—',rev:st.totV,gapTP:gapTP,pChg:rs.pChg,vChg:rs.vChg,fyChg:fyYoY(c),
        beta:(function(){var e=usableEl(c);return e?e.b:null;})()};
    }).sort(function(a,b){return b.rev-a.rev;});
    var declared=FR.codes.filter(function(c){var m=META[c];return m&&(m.dp!=null||m.tp!=null||m.mrp!=null);});
    var below=declared.filter(function(c){var m=META[c],st=rowStats(c);return m.tp&&st.lastP&&st.lastP<m.tp*0.95;});
    var top10=dec.slice(0,10).reduce(function(s,x){return s+x.rev;},0);
    var tot=dec.reduce(function(s,x){return s+x.rev;},0)||1;
    var cats={}; dec.forEach(function(x){cats[x.cat]=(cats[x.cat]||0)+x.rev;});
    var catList=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});

    document.getElementById('decCards').innerHTML=
      '<div class="card" style="background:var(--panel2)"><div class="gl" style="color:var(--amber);font-size:10px;letter-spacing:.8px">DECISION 1 · PRICE ARCHITECTURE</div>'+
      '<p style="font-size:12.4px;margin:6px 0 0">'+below.length+' of '+declared.length+' declared SKUs trade more than 5% below their declared TP. '+
      'Either re-declare the grid or enforce it — the current grid is not the price the market pays.</p></div>'+
      '<div class="card" style="background:var(--panel2)"><div class="gl" style="color:var(--amber);font-size:10px;letter-spacing:.8px">DECISION 2 · CONCENTRATION</div>'+
      '<p style="font-size:12.4px;margin:6px 0 0">The top 10 SKUs are '+pf(top10/tot,0)+' of revenue; '+catList[0]+' alone is '+pf(cats[catList[0]]/tot,0)+'. '+
      'Pricing on a handful of codes decides the P&amp;L — govern those as a separate tier.</p></div>'+
      '<div class="card" style="background:var(--panel2)"><div class="gl" style="color:var(--amber);font-size:10px;letter-spacing:.8px">DECISION 3 · PORTFOLIO SHAPE</div>'+
      '<p style="font-size:12.4px;margin:6px 0 0">'+catList.length+' categories are live. Below the top three ('+catList[0]+', '+catList[1]+', '+catList[2]+') the tail — '+catList.slice(3,6).join(', ')+' — '
      'is where a niche margin can be built without disturbing the bulk price.</p></div>';

    var top=dec.slice(0,15);
    var W=980,rowH=22,H=top.length*rowH+40,x0=300,wd=520;
    var maxR=Math.max.apply(null,top.map(function(x){return x.rev;}).concat([1]));
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
    top.forEach(function(x,i){
      var y=10+i*rowH, len=Math.max(2,x.rev/maxR*wd);
      var col=x.gapTP!=null?(x.gapTP<-0.05?'#f26d6d':(x.gapTP<0?'#f5a524':'#2dd4bf')):(x.pChg==null?'#4b5a6b':(x.pChg<0?'rgba(242,109,109,.45)':'rgba(45,212,191,.45)'));
      var tip='<b>'+esc(x.n)+'</b><br>Revenue ৳'+bcr(x.rev)+' Cr<br>Realized vs TP '+(x.gapTP!=null?pf(x.gapTP):'—')+'<br>Price Δ '+pf(x.pChg)+' · Volume Δ '+pf(x.vChg);
      s+='<text x="0" y="'+(y+11)+'" fill="#8b9bb0" font-size="8.6">'+x.n.slice(0,42)+'</text>';
      s+='<rect x="'+x0+'" y="'+y+'" width="'+len+'" height="11" rx="2" fill="'+col+'" opacity=".85"/>';
      s+='<text x="'+(x0+len+5)+'" y="'+(y+10)+'" fill="#8b9bb0" font-size="8.2">৳'+bcr(x.rev)+' Cr</text>';
      s+='<rect data-tip="'+esc(tip)+'" data-code="'+x.c+'" x="0" y="'+(y-2)+'" width="'+W+'" height="15" fill="transparent"/>';
    });
    s+='</svg><div class="legend"><span><i style="background:#2dd4bf"></i>at or above declared TP</span><span><i style="background:#f5a524"></i>0 to -5% vs TP</span><span><i style="background:#f26d6d"></i>more than 5% below TP</span><span><i style="background:#4b5a6b"></i>no declared price</span></div>';
    document.getElementById('cDec').innerHTML=s; bindAll(document.getElementById('cDec'));

    document.querySelector('#tDec tbody').innerHTML=dec.slice(0,25).map(function(x){
      var read=x.gapTP==null?'No declared price — set the grid before pricing actions':(x.gapTP<-0.05?'Trading below declared TP — re-declare or enforce':'Within the declared grid');
      return '<tr data-code="'+x.c+'"><td><b>'+x.n+'</b><div class="small">'+x.c+'</div></td><td>'+x.cat+'</td><td>৳'+bcr(x.rev)+' Cr</td>'+
        '<td class="'+cls(x.fyChg)+'">'+(x.fyChg!=null&&Math.abs(x.fyChg)>3?((x.fyChg>0?'&gt;+300%':'&lt;−75%')):pf(x.fyChg))+'</td><td class="'+cls(x.gapTP)+'">'+(x.gapTP!=null?pf(x.gapTP):'—')+'</td>'+
        '<td>'+(x.beta!=null?x.beta.toFixed(2):'—')+'</td><td class="small">'+read+'</td></tr>';
    }).join('');
    bindAll(document.getElementById('tDec'));
  })();

  /* ---------- 03 Action ---------- */
  (function(){
    var dec=FR.codes.map(function(c){var m=META[c]||{},st=rowStats(c),rs=recentStats(c);
      return {c:c,n:m.n||c,cat:m.cat||'—',rev:st.totV,tp:m.tp||null,lastP:st.lastP,gapTP:(m.tp&&st.lastP)?st.lastP/m.tp-1:null,pChg:rs.pChg,vChg:rs.vChg};})
      .sort(function(a,b){return b.rev-a.rev;});
    var below=dec.filter(function(x){return x.gapTP!=null&&x.gapTP<-0.05;});
    var failedCuts=dec.filter(function(x){return x.pChg!=null&&x.pChg<-0.02&&x.vChg!=null&&x.vChg<0;});
    var risers=dec.filter(function(x){return x.pChg!=null&&x.pChg>0.02&&x.vChg!=null&&x.vChg>=0;});
    var noGrid=dec.filter(function(x){return x.tp==null;}).length;
    var acts=[
      ['High','Re-declare or enforce TP on the '+below.length+' SKUs trading >5% below grid','Realized vs TP gap: '+below.slice(0,3).map(function(x){return x.n.slice(0,22)+' '+pf(x.gapTP);}).join(' · '),'Brand & Pricing'],
      ['High','Stop the price cuts that did not buy volume ('+failedCuts.length+' SKUs)','Price and volume both fell: '+failedCuts.slice(0,3).map(function(x){return x.n.slice(0,22);}).join(' · '),'Sales'],
      ['Medium','Extend price on the '+risers.length+' SKUs where a rise held volume','Price + volume both positive — test the next increment','Brand & Pricing'],
      ['Medium','Set a declared grid for the '+noGrid+' SKUs that have none','No DP/TP/MRP in the ERP — pricing is uncontrolled','Finance & Pricing'],
      ['Low','Hold recovery review monthly against the ৳'+bcr((function(){var g=sameMonthGap();var a=g.months.reduce(function(s,m){return s+(g.cur[m]||0);},0),b=g.months.reduce(function(s,m){return s+(g.prev[m]||0);},0);return a-b;})())+' Cr gap','Gap vs same months last FY','CEO / SBU Head']
    ];
    document.querySelector('#tAct tbody').innerHTML=acts.map(function(a,i){
      var tag=a[0]==='High'?'t-pos':(a[0]==='Medium'?'t-neg':'t-mut');
      return '<tr><td>'+(i+1)+'</td><td><span class="tag '+tag+'">'+a[0]+'</span></td><td>'+a[1]+'</td><td class="small">'+a[2]+'</td><td class="small">'+a[3]+'</td></tr>';
    }).join('');
  })();

  /* ---------- 04 At-risk ---------- */
  (function(){
    var risk=FR.codes.map(function(c){var m=META[c]||{},st=rowStats(c),rs=recentStats(c);
      var gap=(m.tp&&st.lastP)?st.lastP/m.tp-1:null;
      return {c:c,n:m.n||c,cat:m.cat||'—',rev:st.totV,lastP:st.lastP,tp:m.tp,gap:gap,pChg:rs.pChg,vChg:rs.vChg};})
      .filter(function(x){return (x.gap!=null&&x.gap<-0.05)||(x.pChg!=null&&x.pChg<-0.02&&x.vChg!=null&&x.vChg<0);})
      .sort(function(a,b){return b.rev-a.rev;});
    var W=980,H=Math.max(180,Math.min(risk.length,22)*20+30),x0=300,wd=520;
    var maxAbs=Math.max.apply(null,risk.map(function(x){return Math.abs(x.gap||0);}).concat([0.05]));
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="'+x0+'" x2="'+x0+'" y1="8" y2="'+(H-12)+'" stroke="#3a4a5e"/>';
    risk.slice(0,22).forEach(function(x,i){var y=8+i*20,len=Math.min(Math.abs(x.gap||0)/maxAbs*wd,wd);
      var col=(x.gap!=null&&x.gap<-0.05)?'#f26d6d':'#f5a524';
      s+='<text x="0" y="'+(y+11)+'" fill="#8b9bb0" font-size="8.5">'+x.n.slice(0,42)+'</text>';
      s+='<rect x="'+x0+'" y="'+y+'" width="'+Math.max(len,1)+'" height="10" rx="2" fill="'+col+'" opacity=".85"/>';
      s+='<text x="'+(x0+len+5)+'" y="'+(y+9)+'" fill="'+col+'" font-size="8.2">'+(x.gap!=null?pf(x.gap):'—')+'</text>';});
    s+='</svg>';
    document.getElementById('cRisk').innerHTML=s;

    document.querySelector('#tRisk tbody').innerHTML=risk.slice(0,30).map(function(x){
      var breach=(x.gap!=null&&x.gap<-0.05);
      var dir=breach?'Re-declare / enforce':'Investigate';
      var act=breach?'Rebase the declared TP to the transacted price, or stop approving the discount':'Price and volume both fell: check availability, credit and tender timing before restoring price';
      return '<tr data-code="'+x.c+'"><td><b>'+x.n+'</b><div class="small">'+x.c+'</div></td><td>'+x.cat+'</td><td>৳'+bcr(x.rev)+' Cr</td>'+
        '<td>'+nf(x.lastP,2)+'</td><td>'+(x.tp!=null?nf(x.tp,2):'—')+'</td><td class="neg">'+(x.gap!=null?pf(x.gap):'—')+'</td>'+
        '<td class="'+cls(-(x.pChg||0))+'">'+pf(x.pChg)+'</td><td class="'+cls(x.vChg||0)+'">'+pf(x.vChg)+'</td>'+
        '<td>'+dir+'</td><td class="small">'+act+'</td></tr>';
    }).join('');
    bindAll(document.getElementById('tRisk'));

    document.getElementById('riskNote').innerHTML='<b>Why this is not a P&amp;L loss list.</b> AEL posts no COGS: 0 of 234,781 delivery lines carry a cost, and the item master average rate implies every top SKU sells below cost (e.g. Atta 1 kg ৳64.3 cost vs ৳53 realised), which is not credible. Rather than publish a fake gross margin, this block screens <b>price realisation</b> — the gap between the price actually transacted and the price the business declared. '+risk.length+' SKUs fail that screen.';
  })();

  /* ---------- 05 Recovery ---------- */
  (function(){
    var g=sameMonthGap();
    var names={7:'Jul',8:'Aug',9:'Sep',10:'Oct',11:'Nov',12:'Dec',1:'Jan',2:'Feb',3:'Mar',4:'Apr',5:'May',6:'Jun'};
    var rows='',totalC=0,totalP=0;
    g.months.forEach(function(m){
      var cv=g.cur[m]||0, pv=g.prev[m]||0; totalC+=cv; totalP+=pv;
      rows+='<tr><td>'+names[m]+'</td><td>৳'+bcr(cv)+' Cr</td><td>৳'+bcr(pv)+' Cr</td>'+
        '<td class="'+cls(cv-pv)+'">'+(cv-pv<0?'−':'')+'৳'+bcr(Math.abs(cv-pv))+'</td><td class="'+cls(cv-pv)+'">'+pf(pv?cv/pv-1:null)+'</td></tr>';
    });
    rows+='<tr style="border-top:2px solid var(--line)"><td><b>Total</b></td><td><b>৳'+bcr(totalC)+' Cr</b></td><td><b>৳'+bcr(totalP)+' Cr</b></td>'+
      '<td class="neg"><b>−৳'+bcr(Math.abs(totalC-totalP))+'</b></td><td class="neg"><b>'+pf(totalP?totalC/totalP-1:null)+'</b></td></tr>';
    document.querySelector('#tRec tbody').innerHTML=rows;

    var W=980,H=250,pad={l:52,r:16,t:16,b:36};
    var maxV=Math.max.apply(null,g.months.map(function(m){return Math.max(g.cur[m]||0,g.prev[m]||0);}).concat([1]));
    var bw=(W-pad.l-pad.r)/Math.max(1,g.months.length);
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
    for(var i=0;i<=4;i++){var y=pad.t+(H-pad.t-pad.b)*i/4;
      s+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y+'" y2="'+y+'" stroke="#22303f"/>';
      s+='<text x="'+(pad.l-6)+'" y="'+(y+3)+'" fill="#8b9bb0" font-size="8.5" text-anchor="end">'+Math.round(maxV*(1-i/4)/1e7)+'</text>';}
    g.months.forEach(function(m,k){
      var x=pad.l+k*bw;
      var hc=(H-pad.t-pad.b)*(g.cur[m]||0)/maxV, hp=(H-pad.t-pad.b)*(g.prev[m]||0)/maxV;
      s+='<rect x="'+(x+bw*0.12)+'" y="'+(H-pad.b-hp)+'" width="'+(bw*0.36)+'" height="'+hp+'" fill="rgba(139,155,176,.35)"/>';
      s+='<rect x="'+(x+bw*0.52)+'" y="'+(H-pad.b-hc)+'" width="'+(bw*0.36)+'" height="'+hc+'" fill="'+(hc<hp?'#f26d6d':'#2dd4bf')+'"/>';
      s+='<text x="'+(x+bw/2)+'" y="'+(H-14)+'" fill="#8b9bb0" font-size="9" text-anchor="middle">'+names[m]+'</text>';
    });
    s+='</svg><div class="legend"><span><i style="background:rgba(139,155,176,.5)"></i>Same month last FY</span><span><i style="background:#f26d6d"></i>This FY (below last year)</span></div>';
    document.getElementById('cRec').innerHTML=s;

    // drivers by category
    var cur={},prev={};
    FR.codes.forEach(function(cc){
      var s2=FR.series[cc],cat=(META[cc]||{}).cat||'Unmapped';
      FR.idxs.forEach(function(mi,k){var x=s2[k];if(!x)return;var mo=+M[mi].slice(5,7),fy=fyOf(M[mi]);
        var latest=fyOf(M[FR.idxs[FR.idxs.length-1]]);
        if(fy===latest) cur[cat]=(cur[cat]||0)+x.v; else if(fy===latest-1) prev[cat]=(prev[cat]||0)+x.v;});
    });
    var cats=Object.keys(cur).map(function(k){return {k:k,d:(cur[k]||0)-(prev[k]||0),c:cur[k]||0,p:prev[k]||0};}).sort(function(a,b){return a.d-b.d;});
    var maxD=Math.max.apply(null,cats.map(function(x){return Math.abs(x.d);}).concat([1]));
    var drv='<div style="display:flex;flex-direction:column;gap:6px">';
    cats.slice(0,8).forEach(function(x){
      drv+='<div style="display:grid;grid-template-columns:130px 1fr 80px;gap:8px;align-items:center">'+
        '<div style="font-size:11px">'+x.k+'</div>'+
        '<div style="background:#16202e;border-radius:4px;height:9px"><div style="width:'+(Math.abs(x.d)/maxD*100)+'%;height:100%;border-radius:4px;background:'+(x.d<0?'#f26d6d':'#2dd4bf')+'"></div></div>'+
        '<div style="text-align:right;font-size:10.5px;color:'+(x.d<0?'#f26d6d':'#2dd4bf')+'">'+bcr(x.d)+' Cr</div></div>';
    });
    drv+='</div>';
    document.getElementById('recDrivers').innerHTML=drv;

    var worst=cats.slice(0,3).map(function(x){return x.k;}).join(', ');
    var gapCr=totalC-totalP;
    document.getElementById('recPlan').innerHTML=
      '<div class="smart">'+
      '<div><span class="sk">S</span><p>Recover ৳'+bcr(Math.abs(gapCr))+' Cr over the remaining '+fyLab(fyOf(M[FR.idxs[FR.idxs.length-1]]))+' months, led by '+worst+'.</p></div>'+
      '<div><span class="sk">M</span><p>Monthly run-rate needs to move from ৳'+bcr(totalC/g.months.length)+' Cr to ৳'+bcr(totalP/g.months.length)+' Cr — a '+pf(totalP?totalC/totalP-1:null)+' gap to close.</p></div>'+
      '<div><span class="sk">A</span><p>Levers that exist today: re-declare the grid on the at-risk SKUs, stop cuts that lost volume, and push the categories where price rose with volume.</p></div>'+
      '<div><span class="sk">R</span><p>Assumes no further price war in bulk commodities; a competitor cut would move the gap, not close it.</p></div>'+
      '<div><span class="sk">T</span><p>Review monthly; Q3 checkpoint (Jan-2027) against the '+names[g.months[0]]+'–'+names[g.months[g.months.length-1]]+' baseline.</p></div>'+
      '</div>'+
      '<div class="small" style="margin-top:10px;line-height:1.7"><b>7P check.</b> '+
      '<b>Product</b> — bulk commodity codes dominate, so differentiation is thin. '+
      '<b>Price</b> — the declared grid is above transacted price on most declared SKUs. '+
      '<b>Place</b> — Chittagong and Narayanganj zones carry the largest delivered value. '+
      '<b>Promotion</b> — schemes exist only on Distributor and only from Dec-2025. '+
      '<b>People</b> — the sales force is incentivised on volume, not realisation. '+
      '<b>Process</b> — discount approvals sit outside the declared grid. '+
      '<b>Physical evidence</b> — MRP on pack is not the price the market pays.</div>'+
      '<div class="small" style="margin-top:8px;line-height:1.7"><b>Game theory.</b> In bulk rice/wheat the competitor set is fragmented (12 brands surveyed); a unilateral price cut is matched within weeks, so the cut buys share only temporarily while permanently lowering the reference price. The credible move is to hold price on elastic SKUs and compete on availability, not to lead a cut.</div>';
  })();
}

function renderAll(){
  renderKPIs(); renderPort(); renderBreadth(); renderNotes();
  if(pick.options.length){
    var lastIdx=FR.idxs[FR.idxs.length-1];
    var def=FR.codes.filter(function(c){var s=FR.series[c],k=FR.idxs.length-1;return s[k]&&s[k].q>0;})[0];
    if(def && (!pick.value || !FR.series[pick.value])) pick.value=def;
  }
  renderSku(); renderMom(); renderDecl(document.getElementById('chq').value||'');
  renderJumps(); renderPg(); renderEl(); renderDDA(); renderChips(); renderRange(); renderExtras();
  if(ELDETAIL) showElDetail(ELDETAIL);
}

/* ---------- wires ---------- */
document.getElementById('dFrom').onchange=function(e){setRange(+e.target.value,null);};
document.getElementById('dTo').onchange=function(e){setRange(null,+e.target.value);};
document.querySelectorAll('[data-range]').forEach(function(b){b.onclick=function(){
  var v=b.getAttribute('data-range');
  if(v==='all')setRange(0,END);
  else setRange(END-(+v)+1,END);};});
document.getElementById('dReset').onclick=function(){F.from=0;F.to=END;F.chans.clear();F.cats.clear();ST.q='';ST.el='';ST.decl='';document.getElementById('q').value='';refresh();};
document.getElementById('q').oninput=function(e){ST.q=e.target.value;renderSku();};
document.getElementById('fEl').onchange=function(e){ST.el=e.target.value;renderSku();};
document.getElementById('fDecl').onchange=function(e){ST.decl=e.target.value;renderSku();};
document.querySelectorAll('#tSku th').forEach(function(th){th.onclick=function(){
  var k=th.dataset.s;if(ST.sort===k)ST.dir*=-1;else{ST.sort=k;ST.dir=-1;}renderSku();};});

refresh();
</script>
</body></html>
