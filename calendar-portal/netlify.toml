[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/plans"
  to = "/.netlify/functions/plans"
  status = 200
  force = true

[[redirects]]
  from = "/api/plans/*"
  to = "/.netlify/functions/plans"
  status = 200
  force = true

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
